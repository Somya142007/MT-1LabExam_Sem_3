<!DOCTYPE html>
<html>

<style>

        font-family:Arial, sans-serif;
        background-color:white;
        text-align:centre;
        padding:30px;
    }
    h1{
        color:red;
    }
    .food{
        background-color:white;
        padding:15px;
        margin:10px;
        width:300px;
        border-radius:10px;
        box-shadow:0 2px 5px gray;
    }
</style>
    </head>
<body>

    <div class="food">

    </div>
    <div class="food">
        <h2>Burger</h2>
        <p>Juicy beef burger with lettuce and tomato.</p>
        <p>Price: $8</p>
    </div>  
    <div class="food">
        <h2>Pasta</h2>
        <p>Classic Italian pasta with marinara sauce.</p>
        <p>Price: $12</p>
    </div>

</html>
